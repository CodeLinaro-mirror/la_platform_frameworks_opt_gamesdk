// Native code coverage settings for an Android module. With
// -PenableCoverage=true, CMake compiles the native code with --coverage, and
// Gradle builds one ABI only. The default ABI, x86_64, matches the CI
// Cuttlefish device (aosp_cf_x86_64_only_phone). Use -PcoverageAbi to select
// a different ABI.
def enableCoverage = project.findProperty("enableCoverage")?.toString()?.toBoolean() == true

android.defaultConfig {
    externalNativeBuild {
        cmake {
            arguments "-DAGDK_ENABLE_COVERAGE=" + (enableCoverage ? "ON" : "OFF")
        }
    }
    if (enableCoverage) {
        ndk { abiFilters project.findProperty("coverageAbi") ?: "x86_64" }
    }
}
