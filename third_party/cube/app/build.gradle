// This file was modified to remove the logic checking if ndk.dir was defined
// in local.properties or in ANDROID_NDK_HOME. Rely instead on Android Studio
// and Gradle to warn about issues with NDK.

apply plugin: 'com.android.application'

def stlType = 'c++_shared'

apply from: '../../../ndk_version.gradle'

android {
    namespace "com.samples.cube"
    compileSdk  31
    ndkVersion agdkNdkVersion

    defaultConfig {
        applicationId 'com.samples.cube'
        minSdk    24 // Official vulkan support starts in version 24
        targetSdk 35
        versionCode  2
        versionName '0.0.2'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_PLATFORM=android-24"
                arguments "-DANDROID_TOOLCHAIN=clang"
                arguments "-DANDROID_STL=${stlType}"
                arguments "-DSAMPLE_NAME=" + project.getName()
            }
        }
    }
    externalNativeBuild {
        cmake {
            path 'CMakeLists.txt'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'),
                    'proguard-rules.pro'
        }
    }
    buildFeatures {
        prefab true
        buildConfig true
    }

    testOptions {
        animationsDisabled = true
    }
}

dependencies {
    // Uncomment this line and comment out "implementation project(":games-controller")"
    // to use a locally built .aar
    //implementation fileTree(dir: '../../../', include: ['games-frame-pacing-release.aar'])
    implementation project(":games-frame-pacing")

    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
}
