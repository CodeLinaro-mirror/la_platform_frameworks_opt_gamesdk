[Hook Scripts]

versions_hook = ${REPO_ROOT}/gamesdk/hooks/check_library_versions.sh ${PREUPLOAD_COMMIT} ${PREUPLOAD_FILES}
version_revision_hook = ${REPO_ROOT}/gamesdk/hooks/check_version_revision.sh ${PREUPLOAD_COMMIT} ${PREUPLOAD_FILES}

[Builtin Hooks]
clang_format = true
commit_msg_changeid_field = true
commit_msg_test_field = true
pylint = true

pylint3 = true

[Builtin Hooks Options]
# Only turn on clang-format check for the following subfolders.
clang_format = --commit ${PREUPLOAD_COMMIT} --style file --extensions c,h,cc,cpp,hpp,java .
